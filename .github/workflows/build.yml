name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Find pubspec.yaml location
        run: find . -name "pubspec.yaml" -not -path "*/.*" | head -5

      - name: Get Flutter dependencies
        run: |
          if [ -f "pubspec.yaml" ]; then
            flutter pub get
          elif [ -f "fitness_tracker_app/pubspec.yaml" ]; then
            cd fitness_tracker_app && flutter pub get
          else
            cd $(dirname $(find . -name "pubspec.yaml" -not -path "*/.*" | head -1)) && flutter pub get
          fi

      - name: Build APK
        run: |
          if [ -f "pubspec.yaml" ]; then
            flutter build apk --debug --no-tree-shake-icons
          elif [ -f "fitness_tracker_app/pubspec.yaml" ]; then
            cd fitness_tracker_app && flutter build apk --debug --no-tree-shake-icons
          else
            cd $(dirname $(find . -name "pubspec.yaml" -not -path "*/.*" | head -1)) && flutter build apk --debug --no-tree-shake-icons
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: elite-fitness-apk
          path: |
            build/app/outputs/apk/debug/app-debug.apk
            **/build/app/outputs/apk/debug/app-debug.apk
          retention-days: 30
