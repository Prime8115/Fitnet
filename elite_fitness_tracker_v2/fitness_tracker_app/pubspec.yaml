name: elite_fitness_tracker
description: Elite 84-Day Fitness Tracker - Full body transformation program tracker
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.1

  # Local database
  sqflite: ^2.3.0
  path: ^1.9.0

  # Shared preferences
  shared_preferences: ^2.2.2

  # Date formatting
  intl: ^0.19.0

  # Icons
  cupertino_icons: ^1.0.6

  # Haptics
  vibration: ^1.8.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
